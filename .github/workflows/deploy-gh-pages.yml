name: VirtuaLink CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtualink-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, linux, x64, virtualink-prod]
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu
        run: sudo /usr/local/sbin/virtualink-deploy "$GITHUB_SHA" "$GITHUB_WORKSPACE"
