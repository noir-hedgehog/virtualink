services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://virtualink:${POSTGRES_PASSWORD}@db:5432/virtualink
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${VIRTUALINK_BIND_ADDRESS:-127.0.0.1}:3060:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtualink
      POSTGRES_USER: virtualink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - virtualink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtualink -d virtualink"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  virtualink-postgres:
